apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: latency-downstream
  namespace: apps
  labels:
    aiops.lab/chaos: "true"
    aiops.lab/scenario: "latency-downstream"
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - apps
    labelSelectors:
      app: service-downstream
  delay:
    latency: "3000ms"
    jitter: "200ms"
  direction: to
  duration: "5m"
