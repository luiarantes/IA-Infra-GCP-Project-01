apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-throttling
  namespace: apps
  labels:
    aiops.lab/chaos: "true"
    aiops.lab/scenario: "cpu-throttling"
spec:
  mode: one
  selector:
    namespaces:
      - apps
    labelSelectors:
      app: service-api
  stressors:
    cpu:
      workers: 2
      load: 95
  duration: "5m"
