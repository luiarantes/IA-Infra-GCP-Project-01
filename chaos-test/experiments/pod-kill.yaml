apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill
  namespace: apps
  labels:
    aiops.lab/chaos: "true"
    aiops.lab/scenario: "pod-kill"
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - apps
    labelSelectors:
      app: gateway
  duration: "5m"
