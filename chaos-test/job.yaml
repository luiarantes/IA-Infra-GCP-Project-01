# Job sob demanda (workflow_dispatch, chaos-test.yml) - mesma logica de
# custo ja usada nos agentes e no load-test: nao roda em background
# continuo. Sem imagem customizada: instala o chaostoolkit via pip no
# proprio comando, direto na imagem publica python:3.12-slim (mesmo
# raciocinio de simplicidade do k6 usando a imagem oficial da Grafana
# sem build nenhum). O experimento (qual .json rodar) vem via ConfigMap
# "chaos-experiment", gerado pelo workflow a partir do arquivo
# escolhido - fonte de verdade so nos .json versionados, sem duplicar.
apiVersion: batch/v1
kind: Job
metadata:
  name: chaos-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: chaos-toolkit-runner
      restartPolicy: Never
      containers:
        - name: chaos-toolkit
          image: python:3.12-slim
          env:
            # Sem isso, o chaostoolkit-kubernetes nao detecta que esta
            # rodando dentro de um pod e tenta falar com localhost:80
            # em vez de usar a config in-cluster (ServiceAccount token
            # + CA cert montados automaticamente pelo Kubernetes).
            - name: CHAOSTOOLKIT_IN_POD
              value: "true"
          command:
            - sh
            - -c
            - |
              set -e
              pip install --no-cache-dir chaostoolkit chaostoolkit-kubernetes
              chaos run /experiments/experiment.json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: experiment
              mountPath: /experiments
      volumes:
        - name: experiment
          configMap:
            name: chaos-experiment
