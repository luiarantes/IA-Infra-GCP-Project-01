# Job sob demanda (workflow_dispatch, load-test.yml) - nao roda em
# background continuo, mesma logica de custo ja aplicada aos agentes
# (fase 5) e ao Job de failsafe. O script (script.js) e montado via
# ConfigMap gerado a partir do proprio arquivo pelo workflow, entao a
# fonte de verdade fica so no .js versionado, sem duplicar conteudo aqui.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/script.js"]
          env:
            - name: GATEWAY_URL
              value: "http://gateway:8080"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script
