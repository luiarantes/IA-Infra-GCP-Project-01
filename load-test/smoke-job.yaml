# Job de validação pós-deploy (Smoke Test E2E)
# Executa 5 iterações leves via k6 para validar conectividade real
# e status 200/202 na cadeia de microsserviços.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-smoke-test
  namespace: apps
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/smoke-test.js"]
          env:
            - name: GATEWAY_URL
              value: "http://gateway.apps:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-smoke-script
