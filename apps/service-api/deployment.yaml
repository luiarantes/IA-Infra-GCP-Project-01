# service-api: recebe do gateway, publica no Pub/Sub e responde 202 de
# imediato - o processamento de fato acontece de forma assincrona no
# service-worker. Usa a KSA microservices-ksa (Workload Identity) para
# publicar no Pub/Sub e exportar trace pro Cloud Trace (fase 8.2) sem
# credencial estatica - ver apps/shared/serviceaccount.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  labels:
    app: service-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-api
  template:
    metadata:
      labels:
        app: service-api
    spec:
      serviceAccountName: microservices-ksa
      containers:
        - name: service-api
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROJECT_ID
              value: "${PROJECT_ID}"
            - name: PUBSUB_TOPIC
              value: "microservices-queue"
          # GKE Autopilot exige requests explicitos em todo pod.
          # cpu 150m (nao 100m) de proposito: o startup com OpenTelemetry
          # e pesado o suficiente pra estourar sozinho o alvo de 50% do
          # HPA (ver hpa.yaml) mesmo sem trafego real, fazendo o HPA
          # escalar a toa a cada restart - achado real do agente
          # pr-creator na issue #10 (2026-08-04).
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Startup com OpenTelemetry e mais pesado que so FastAPI puro
          # - da ate 150s antes das probes normais (mais estritas)
          # passarem a valer.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
