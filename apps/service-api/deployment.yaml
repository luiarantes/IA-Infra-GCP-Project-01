# service-api: recebe do gateway, publica no Pub/Sub e responde 202 de
# imediato - o processamento de fato acontece de forma assincrona no
# service-worker. Usa a KSA microservices-ksa (Workload Identity) para
# publicar sem credencial estatica - ver apps/shared/serviceaccount.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  labels:
    app: service-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-api
  template:
    metadata:
      labels:
        app: service-api
    spec:
      serviceAccountName: microservices-ksa
      containers:
        - name: service-api
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROJECT_ID
              value: "${PROJECT_ID}"
            - name: PUBSUB_TOPIC
              value: "microservices-queue"
          # GKE Autopilot exige requests explicitos em todo pod
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
