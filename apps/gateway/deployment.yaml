# gateway: unico ponto de entrada publico do fluxo da fase 8 (fase
# 8.1 do plano de microsservicos) - encaminha para o service-api. Usa a
# KSA microservices-trace-ksa (fase 8.2) so pra exportar trace pro
# Cloud Trace - nao fala com o Pub/Sub, entao nao ganha as roles de
# publisher/subscriber da KSA usada por service-api/service-worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: microservices-trace-ksa
      containers:
        - name: gateway
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_API_URL
              value: "http://service-api:8080"
            - name: PROJECT_ID
              value: "${PROJECT_ID}"
          # GKE Autopilot exige requests explicitos em todo pod
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
