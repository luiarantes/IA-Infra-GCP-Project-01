# HPA (fase 8.3): GKE Autopilot nao expoe node pools gerenciaveis - o
# jeito de "escalar sob carga" aqui e via replicas de pod, nao via
# nodes dedicados. Sem isso, o Job de carga (load-test/) so aumentaria
# a latencia/erro de um unico pod, nunca demonstraria autoscaling real.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
