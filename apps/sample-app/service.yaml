# ClusterIP de proposito (nao LoadBalancer) - um LoadBalancer do GCP
# custa ~$18/mes rodando, e nao precisamos de acesso publico para testar.
# Para acessar localmente: kubectl port-forward svc/podinfo 9898:9898
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
