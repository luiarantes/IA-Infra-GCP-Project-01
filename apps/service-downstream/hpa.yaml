# HPA (fase 8.3) - ver apps/gateway/hpa.yaml para o raciocinio geral.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-downstream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-downstream
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
