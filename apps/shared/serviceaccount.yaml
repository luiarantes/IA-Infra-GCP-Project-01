# KSA compartilhada por service-api e service-worker (fase 8.1) - o
# binding real de Workload Identity (KSA <-> GSA) e criado pelo modulo
# Terraform infra/modules/workload-identity. ${PROJECT_ID} e substituido
# via envsubst no workflow de deploy, a partir do secret GCP_PROJECT_ID
# ja usado no resto do projeto.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: microservices-ksa
  annotations:
    iam.gke.io/gcp-service-account: microservices-workload@${PROJECT_ID}.iam.gserviceaccount.com
