apiVersion: v1
kind: Secret
metadata:
  name: openobserve-credentials
  namespace: default
type: Opaque
stringData:
  auth_header: "Basic YWRtaW5AZXhhbXBsZS5jb206Q29tcGxleFBhc3N3b3JkMTIzIw=="
  root_user_email: "admin@example.com"
  root_user_password: "ComplexPassword123#"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve
  namespace: default
  labels:
    app: openobserve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      containers:
        - name: openobserve
          image: public.ecr.aws/zinclabs/openobserve:latest
          env:
            - name: ZO_ROOT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: root_user_email
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: root_user_password
            - name: ZO_DATA_DIR
              value: "/data"
            - name: ZO_MEMORY_CACHE_MAX_SIZE
              value: "512"
          ports:
            - containerPort: 5080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve
  namespace: default
spec:
  type: NodePort
  selector:
    app: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: 5080
      nodePort: 30580
