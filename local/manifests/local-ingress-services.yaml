apiVersion: v1
kind: Service
metadata:
  name: gateway-local
  namespace: default
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: buscacep-api-local
  namespace: default
spec:
  type: NodePort
  selector:
    app: buscacep-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-local
  namespace: default
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope-local
  namespace: default
spec:
  type: NodePort
  selector:
    app: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: 4040
      nodePort: 30440
