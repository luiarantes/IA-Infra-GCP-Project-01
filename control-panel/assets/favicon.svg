<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aiops-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background com cantos arredondados estilo app icon -->
  <rect width="64" height="64" rx="14" fill="url(#aiops-bg)"/>
  
  <!-- Anel externo de radar -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.35"/>
  
  <!-- Anel intermediário de telemetria -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.85"/>
  
  <!-- Arco indicador de varredura/pulso -->
  <path d="M 32 18 A 14 14 0 0 1 46 32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Núcleo central de status -->
  <circle cx="32" cy="32" r="5" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
