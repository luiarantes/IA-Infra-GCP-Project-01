name: Agent - Log Analyzer

# Fase 5: so roda sob demanda (sem schedule automatico) - decisao
# deliberada para nao gerar custo continuo de chamadas a API da
# Anthropic enquanto o projeto ainda esta em fase de teste. O pre-check
# abaixo tambem evita acionar a IA quando nao ha nada de errado.
on:
  workflow_dispatch:
    inputs:
      ai_engine:
        description: "Motor de IA (ollama-gpu = Privado/Zero Egress no GKE [DEFAULT] | claude = Claude Code [Apenas via escolha humana])"
        required: true
        default: "ollama-gpu"
        type: choice
        options:
          - "ollama-gpu"
          - "claude"
      force_run:
        description: "Ignorar pre-check de métricas e forçar investigação com IA (Modo Laboratório/Treinamento)"
        required: false
        default: false
        type: boolean
      target_app:
        description: "Microsserviço alvo específico para investigação (opcional: ex: service-api, gateway, buscacep-api)"
        required: false
        default: ""
        type: string
      context_hint:
        description: "Pista, contexto ou hipótese do operador humano (opcional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  issues: write # cobre tambem "gh label create" (labels sao parte da API de issues)

env:
  CLUSTER_NAME: aiops-gke
  CLUSTER_LOCATION: us-central1-a
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  check-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ env.GCP_PROJECT }}

      # Sem IA de proposito: consulta direta as metricas, mesma tecnica
      # validada manualmente na fase 4. So gasta tokens de API se
      # encontrar algum sinal real na janela recente. Cobre os 5 tipos
      # de incidente que os alertas da fase 4/7 monitoram: restart,
      # CPU, memoria, erros 5xx e latencia.
      - name: "Pre-check: algum sinal de problema?"
        id: precheck
        run: |
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          TOKEN=$(gcloud auth print-access-token)
          FOUND=false
          SIGNALS=""

          is_gt() { awk -v a="$1" -v b="$2" 'BEGIN{exit !(a>b)}'; }

          # Regex dos apps monitorados (mesma lista usada nos
          # pod_name_regex do modulo Terraform infra/modules/observability,
          # ver infra/environments/test/main.tf) - atualize aqui tambem
          # ao adicionar um app novo em apps/. Sem isso, o pre-check
          # pegava qualquer container do namespace default, incluindo
          # Jobs efemeros (load-test, chaos-test) - achado real de um
          # agente (issue #10, 2026-08-04).
          KNOWN_APPS_REGEX="(podinfo|gateway|service-api|service-worker|service-downstream)-.*"

          # Metricas classicas do Cloud Monitoring (timeSeries.list) -
          # cobre restart_count, cpu e memoria. Escopado por
          # cluster/namespace/pod_name - mesma logica das alert policies
          # do Terraform (fase 8.4), pra nao confundir sinal dos nossos
          # apps com ruido de containers do proprio GKE (kube-system,
          # gke-gmp-system etc - esses tem limites minusculos e vivem
          # naturalmente com utilizacao alta, gerando falso positivo).
          check_classic_metric() {
            local metric_type="$1"
            local aligner="$2"
            local filter="resource.type=\"k8s_container\" AND resource.labels.cluster_name=\"${CLUSTER_NAME}\" AND resource.labels.namespace_name=\"default\" AND resource.labels.pod_name=monitoring.regex.full_match(\"${KNOWN_APPS_REGEX}\") AND metric.type=\"${metric_type}\""
            curl -s -G -H "Authorization: Bearer ${TOKEN}" \
              --data-urlencode "filter=${filter}" \
              --data-urlencode "interval.startTime=${START}" \
              --data-urlencode "interval.endTime=${END}" \
              --data-urlencode "aggregation.alignmentPeriod=900s" \
              --data-urlencode "aggregation.perSeriesAligner=${aligner}" \
              "https://monitoring.googleapis.com/v3/projects/${GCP_PROJECT}/timeSeries" \
              | jq '[.timeSeries[]?.points[]?.value | (.int64Value // .doubleValue // "0") | tonumber] | max // 0'
          }

          RESTART_DELTA=$(check_classic_metric "kubernetes.io/container/restart_count" "ALIGN_DELTA")
          echo "restart_count (variacao na janela): $RESTART_DELTA"
          if is_gt "$RESTART_DELTA" 0; then FOUND=true; SIGNALS="${SIGNALS}restart_count "; fi

          CPU_MAX=$(check_classic_metric "kubernetes.io/container/cpu/limit_utilization" "ALIGN_MEAN")
          echo "cpu limit_utilization (max): $CPU_MAX"
          if is_gt "$CPU_MAX" 0.8; then FOUND=true; SIGNALS="${SIGNALS}cpu "; fi

          MEM_MAX=$(check_classic_metric "kubernetes.io/container/memory/limit_utilization" "ALIGN_MEAN")
          echo "memory limit_utilization (max): $MEM_MAX"
          if is_gt "$MEM_MAX" 0.8; then FOUND=true; SIGNALS="${SIGNALS}memory "; fi

          # Metricas do podinfo (via Managed Prometheus) usam a API
          # compativel com PromQL - endpoint diferente do timeSeries.list.
          query_promql() {
            curl -s -G -H "Authorization: Bearer ${TOKEN}" \
              --data-urlencode "query=$1" \
              "https://monitoring.googleapis.com/v1/projects/${GCP_PROJECT}/location/global/prometheus/api/v1/query" \
              | jq -r '.data.result[0].value[1] // "0"'
          }

          FIVEXX_RATE=$(query_promql 'sum(rate(http_requests_total{status=~"5.."}[5m]))')
          echo "taxa de erros 5xx: $FIVEXX_RATE"
          if is_gt "$FIVEXX_RATE" 0; then FOUND=true; SIGNALS="${SIGNALS}http_5xx "; fi

          LATENCY_P95=$(query_promql 'histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))')
          echo "latencia p95 (segundos): $LATENCY_P95"
          if is_gt "$LATENCY_P95" 1; then FOUND=true; SIGNALS="${SIGNALS}latency "; fi

          # Sobrescrita manual / Modo Laboratório
          if [ "${{ inputs.force_run }}" = "true" ]; then
            echo "⚡ Modo Laboratório: Execução forçada solicitada pelo operador humano."
            FOUND=true
            SIGNALS="${SIGNALS}manual_force "
          fi

          if [ -n "${{ inputs.target_app }}" ]; then
            echo "🎯 Alvo específico definido: ${{ inputs.target_app }}"
            SIGNALS="${SIGNALS}target:${{ inputs.target_app }} "
          fi

          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "signals=${SIGNALS}" >> "$GITHUB_OUTPUT"

      # Motor Padrão: Modelo Privado/Local (Ollama com aceleração GPU no GKE)
      # 100% dos logs, métricas e código permanecem dentro do perímetro de segurança (Zero Data Egress)
      - name: "Investigar com IA Local (Ollama GPU no GKE - Default)"
        if: steps.precheck.outputs.found == 'true' && (github.event.inputs.ai_engine == 'ollama-gpu' || github.event.inputs.ai_engine == '')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNALS_FOUND: ${{ steps.precheck.outputs.signals }}
          AIOPS_ENV: "gcp"
          AIOPS_AI_PROVIDER: "ollama"
          AIOPS_OLLAMA_MODEL: "qwen2.5-coder:7b"
          AIOPS_PROMETHEUS_URL: "http://localhost:5080/api/default/prometheus"
          AIOPS_LOKI_URL: "http://localhost:3100"
          AIOPS_LOCAL_TRACKER: "github"
        run: |
          set -e
          echo "🤖 [AIOps Privado]: Iniciando investigação com Modelo Local no GKE (Zero Data Export)..."

          # Port-forwards para comunicação interna com os serviços do GKE
          kubectl port-forward svc/ollama 11434:11434 -n default > /tmp/pf-ollama.log 2>&1 &
          PF_OLLAMA=$!
          kubectl port-forward svc/openobserve 5080:5080 -n default > /tmp/pf-oo.log 2>&1 &
          PF_OO=$!
          kubectl port-forward svc/loki 3100:3100 -n default > /tmp/pf-loki.log 2>&1 &
          PF_LOKI=$!

          trap "kill $PF_OLLAMA $PF_OO $PF_LOKI 2>/dev/null || true" EXIT

          echo "⏳ Aguardando disponibilidade do endpoint do Ollama GPU..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/version >/dev/null 2>&1; then
              echo "✅ Conexão com o Ollama GPU estabelecida com sucesso!"
              break
            fi
            sleep 1
          done

          EXTRA_ARGS=""
          if [ -n "${{ inputs.target_app }}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --app '${{ inputs.target_app }}'"
          fi
          if [ -n "${{ inputs.context_hint }}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --hint '${{ inputs.context_hint }}'"
          fi
          if [ "${{ inputs.force_run }}" = "true" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --force"
          fi

          # Executa o Agent Runner Engine agnóstico de Self-Healing
          eval python3 agents/engine/agent_runner.py \
            --role "log-analyzer" \
            --task-file "agents/log-analyzer/TASK.md" \
            --context "\"O pre-check encontrou sinal(is) de problema no cluster GKE: ${SIGNALS_FOUND}\"" \
            ${EXTRA_ARGS}

      # Motor Alternativo: Claude Code (SaaS externo / Anthropic API)
      # ATENÇÃO: Desativado por padrão! Somente executa se o operador humano escolher explicitamente no workflow dispatch.
      - name: "Instalar Claude Code (Apenas se explicitamente selecionado por humano)"
        if: steps.precheck.outputs.found == 'true' && github.event.inputs.ai_engine == 'claude'
        run: |
          echo "⚠️ ATENÇÃO: Operador humano selecionou explicitamente o Claude Code (SaaS externo)."
          npm install -g @anthropic-ai/claude-code

      - name: "Investigar com Claude Code (Externo / Anthropic)"
        if: steps.precheck.outputs.found == 'true' && github.event.inputs.ai_engine == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SIGNALS_FOUND: ${{ steps.precheck.outputs.signals }}
          TARGET_APP: ${{ github.event.inputs.target_app }}
          CONTEXT_HINT: ${{ github.event.inputs.context_hint }}
        run: |
          EXTRA_TXT=""
          if [ -n "$TARGET_APP" ]; then
            EXTRA_TXT="${EXTRA_TXT} Alvo direcionado: ${TARGET_APP}."
          fi
          if [ -n "$CONTEXT_HINT" ]; then
            EXTRA_TXT="${EXTRA_TXT} Pista do operador: ${CONTEXT_HINT}."
          fi

          TASK="$(cat agents/log-analyzer/TASK.md)

          O pre-check encontrou sinal(is) de problema em: ${SIGNALS_FOUND}.${EXTRA_TXT}"
          claude -p "$TASK" \
            --allowedTools "Bash(kubectl get:*)" "Bash(kubectl describe:*)" "Bash(kubectl logs:*)" "Bash(kubectl top:*)" "Bash(gcloud logging read:*)" "Bash(gcloud monitoring:*)" "Bash(gh issue create:*)" "Bash(gh issue list:*)" "Bash(gh label create:*)"

      - name: Nada encontrado no pre-check
        if: steps.precheck.outputs.found == 'false'
        run: echo "Nenhum sinal de problema recente - nenhum modelo ou API de IA foi acionado (consumo zero)."
