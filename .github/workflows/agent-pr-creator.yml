name: Agent - PR Creator

# Fase 6: dispara automaticamente quando existe uma issue com o label
# "agent-finding" - encadeia sem custo de polling, ja que so existe uma
# issue dessas quando o pre-check da fase 5 encontrou um problema real.
#
# "opened" cobre o caso da fase 5 (gh issue create --label ...) - quando
# o label vem junto na criacao, o GitHub NAO dispara um evento "labeled"
# separado, so "opened". "labeled" cobre o caso de alguem adicionar o
# label manualmente numa issue ja existente depois.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      ai_engine:
        description: "Motor de IA (ollama-gpu = Privado/Zero Egress no GKE [DEFAULT] | claude = Claude Code [Apenas via escolha humana])"
        required: true
        default: "ollama-gpu"
        type: choice
        options:
          - "ollama-gpu"
          - "claude"
      issue_number:
        description: "Número da issue para propor correção (se acionado manualmente)"
        required: false
        type: string
      context_instruction:
        description: "Instrução específica ou contexto adicional fornecido pelo operador humano (opcional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  CLUSTER_NAME: aiops-gke
  CLUSTER_LOCATION: us-central1-a
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  propose-fix:
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.issue.labels.*.name, 'agent-finding') && !contains(github.event.issue.labels.*.name, 'env:local'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidade do git para commits do agente
        run: |
          git config user.name "aiops-agent"
          git config user.email "aiops-agent@users.noreply.github.com"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ env.GCP_PROJECT }}

      # Motor Padrão: Modelo Privado/Local (Ollama com aceleração GPU no GKE)
      # Zero exportação de dados / Zero custo de API externa
      - name: "Executar Correção com IA Local (Ollama GPU no GKE - Default)"
        if: github.event.inputs.ai_engine != 'claude' && !contains(github.event.issue.labels.*.name, 'ai:claude')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          CONTEXT_INSTRUCTION: ${{ github.event.inputs.context_instruction }}
          AIOPS_ENV: "gcp"
          AIOPS_AI_PROVIDER: "ollama"
          AIOPS_OLLAMA_MODEL: "qwen2.5-coder:7b"
          AIOPS_LOCAL_TRACKER: "github"
          AIOPS_OLLAMA_TIMEOUT: "600"
        run: |
          set -e
          echo "🤖 [AIOps Privado]: Iniciando geração de fix com Modelo Local no GKE (Zero Data Export)..."

          kubectl port-forward svc/ollama 11434:11434 -n observability > /tmp/pf-ollama-pr.log 2>&1 &
          PF_OLLAMA=$!
          trap "kill $PF_OLLAMA 2>/dev/null || true" EXIT

          echo "⏳ Aguardando endpoint do Ollama GPU..."
          CONNECTED=false
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/version >/dev/null 2>&1; then
              echo "✅ Conexão com o Ollama GPU estabelecida com sucesso!"
              CONNECTED=true
              break
            fi
            sleep 1
          done
          if [ "$CONNECTED" != "true" ]; then
            echo "❌ Erro: Endpoint do Ollama não respondeu na porta 11434 após 30 segundos. Logs do port-forward:"
            cat /tmp/pf-ollama-pr.log || true
            exit 1
          fi

          EXTRA_HINT=""
          if [ -n "$CONTEXT_INSTRUCTION" ]; then
            EXTRA_HINT=" --hint \"$CONTEXT_INSTRUCTION\""
          fi

          eval python3 agents/engine/agent_runner.py \
            --role "pr-creator" \
            --task-file "agents/pr-creator/TASK.md" \
            --context "\"Issue #${ISSUE_NUMBER}: Leia a issue usando view_issue(issue_number=${ISSUE_NUMBER}), analise os manifestos em apps/ com read_file, aplique a correção cirúrgica com apply_patch e crie o Pull Request com create_git_pr(branch_name='agent-fix/issue-${ISSUE_NUMBER}').\"" \
            $EXTRA_HINT

      # Motor Alternativo: Claude Code (SaaS externo / Anthropic API)
      # ATENÇÃO: Desativado por padrão! Somente executa se o operador humano escolher explicitamente via input ou label 'ai:claude'.
      - name: "Instalar Claude Code (Apenas se explicitamente selecionado por humano)"
        if: github.event.inputs.ai_engine == 'claude' || contains(github.event.issue.labels.*.name, 'ai:claude')
        run: |
          echo "⚠️ ATENÇÃO: Operador humano selecionou explicitamente o Claude Code (SaaS externo)."
          npm install -g @anthropic-ai/claude-code

      - name: "Avaliar diagnóstico e propor fix com Claude Code (Externo / Anthropic)"
        if: github.event.inputs.ai_engine == 'claude' || contains(github.event.issue.labels.*.name, 'ai:claude')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
        run: |
          TASK=$(sed "s/\${ISSUE_NUMBER}/${ISSUE_NUMBER}/g" agents/pr-creator/TASK.md)
          claude -p "$TASK" \
            --allowedTools "Bash(gh issue view:*)" "Bash(gh issue comment:*)" "Bash(git checkout:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git push:*)" "Bash(gh pr create:*)" "Bash(gh label create:*)" "Read" "Edit(apps/**)" "Write(apps/**)" "Edit(observability/**)" "Write(observability/**)"
