name: Agent - PR Creator

# Fase 6: dispara automaticamente quando a fase 5 rotula uma issue com
# "agent-finding" - encadeia sem custo de polling, ja que so existe uma
# issue dessas quando o pre-check da fase 5 encontrou um problema real.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose-fix:
    if: github.event.label.name == 'agent-finding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidade do git para commits do agente
        run: |
          git config user.name "aiops-agent"
          git config user.email "aiops-agent@users.noreply.github.com"

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Avaliar diagnostico e propor fix (se houver)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          TASK=$(sed "s/\${ISSUE_NUMBER}/${ISSUE_NUMBER}/g" agents/pr-creator/TASK.md)
          claude -p "$TASK" \
            --allowedTools "Bash(gh issue view:*)" "Bash(gh issue comment:*)" "Bash(git checkout:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git push:*)" "Bash(gh pr create:*)" "Read" "Edit(apps/**)" "Write(apps/**)" "Edit(observability/**)" "Write(observability/**)"
