name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação a executar"
        required: true
        default: "check_cost"
        type: choice
        options:
          - "check_cost"
          - "inspect"
          - "expand_nodes"
          - "verify_destroyed"
          - "cleanup_gpu_pool"
          - "inject_probe_crash"
          - "restore_service_api"
          - "inject_oom_kill"

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        if: github.event.inputs.action != 'verify_destroyed'
        continue-on-error: true
        with:
          cluster_name: aiops-gke
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Consultar Custo Atual do GCP (FinOps)
        if: github.event.inputs.action == 'check_cost' || github.event.inputs.action == ''
        run: |
          echo "========================================================="
          echo "      CONSULTA DE CUSTOS EM TEMPO REAL — GCP FINOPS      "
          echo "========================================================="

          echo "--- 1. NOTIFICAÇÕES DE ORÇAMENTO (PUB/SUB) ---"
          MESSAGES=$(gcloud pubsub subscriptions pull budget-alerts-failsafe-pull --limit=10 --format=json 2>/dev/null || true)
          if [ -n "$MESSAGES" ] && [ "$MESSAGES" != "[]" ]; then
            echo "$MESSAGES" | jq -r '
              .[]?.message.data
              | @base64d | fromjson
              | "💰 Gasto Atual: R$ \(.costAmount // 0) / Teto: R$ \(.budgetAmount // 250) (Proporção: \(((.costAmount // 0) / (.budgetAmount // 250) * 100) | round)%) - Período a partir de: \(.costIntervalStart)"
            '
          else
            echo "ℹ️ Nenhuma nova notificação na fila do Pub/Sub no momento."
          fi

          echo ""
          echo "--- 2. EXPORTAÇÃO DE FATURAMENTO NO BIGQUERY ---"
          TABLES=$(bq ls --project_id=${{ secrets.GCP_PROJECT_ID }} billing_export 2>/dev/null || true)
          echo "$TABLES"
          if echo "$TABLES" | grep -q "gcp_billing_export"; then
            TABLE_NAME=$(echo "$TABLES" | grep "gcp_billing_export" | awk '{print $1}' | head -1)
            echo "📊 Executando agregação por serviço na tabela BigQuery: $TABLE_NAME..."
            bq query --use_legacy_sql=false --format=pretty "
              SELECT
                service.description as servico,
                ROUND(SUM(cost), 2) as custo_brl
              FROM \`${{ secrets.GCP_PROJECT_ID }}.billing_export.${TABLE_NAME}\`
              WHERE _PARTITIONDATE >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
              GROUP BY 1
              ORDER BY custo_brl DESC
              LIMIT 10;
            "
          else
            echo "ℹ️ Dataset billing_export ativo. O link de exportação do BigQuery ainda não foi configurado na console de faturamento."
          fi

          echo ""
          echo "--- 3. STATUS DO ORÇAMENTO NA CLOUD BILLING API ---"
          gcloud billing budgets list --billing-account=${{ secrets.GCP_BILLING_ACCOUNT_ID }} --format="yaml" 2>/dev/null || true
          echo "========================================================="

      - name: Inspecionar Node Pools e Quotas de GPU
        if: github.event.inputs.action == 'inspect'
        run: |
          echo "=== K8S NODES ==="
          kubectl get nodes -o wide

          echo "=== K8S PODS (ALL NAMESPACES) ==="
          kubectl get pods -A -o wide

          echo "=== K8S SERVICES (ALL NAMESPACES) ==="
          kubectl get svc -A

          echo "=== K8S HPA (ALL NAMESPACES) ==="
          kubectl get hpa -A

          echo "=== JOBS (APPS NAMESPACE) ==="
          kubectl get jobs -n apps -o wide || true

          echo "=== NODE POOLS LIST ==="
          gcloud container node-pools list --cluster aiops-gke --zone us-central1-a

          echo "=== GPU SPOT POOL STATUS ==="
          gcloud container node-pools describe gpu-spot-pool --cluster aiops-gke --zone us-central1-a --format="yaml(status,statusMessage,conditions)" || true

          echo "=== GKE RECENT OPERATIONS ==="
          gcloud container operations list --filter="targetLink:clusters/aiops-gke" --sort-by=~startTime --limit=5 --format="yaml(name,operationType,status,statusMessage,detail)"

          echo "=== GLOBAL GPU QUOTAS (GPUS_ALL_REGIONS) ==="
          gcloud compute project-info describe --project ${{ secrets.GCP_PROJECT_ID }} --format="yaml(quotas)" | grep -B 1 -A 3 -i "gpu" || true

          echo "=== GPU QUOTAS IN US-CENTRAL1 ==="
          gcloud compute regions describe us-central1 --format="yaml(quotas)" | grep -B 1 -A 3 -i "gpu" || true

      - name: Expandir Node Pool Autoscaling (max_node_count = 4)
        if: github.event.inputs.action == 'expand_nodes'
        run: |
          echo "🚀 Atualizando autoscaling de spot-node-pool para min=1, max=4..."
          gcloud container node-pools update spot-node-pool \
            --cluster aiops-gke \
            --zone us-central1-a \
            --enable-autoscaling \
            --min-nodes=1 \
            --max-nodes=4
          echo "✅ Autoscaling atualizado com sucesso!"
          echo "⏳ Aguardando 40s para o Cluster Autoscaler avaliar pods pendentes..."
          sleep 40
          kubectl get nodes -o wide
          kubectl get pods -n apps -o wide

      - name: Cleanup GPU Spot Pool (se selecionado)
        if: github.event.inputs.action == 'cleanup_gpu_pool'
        run: |
          echo "🧹 Excluindo gpu-spot-pool com erro no cluster..."
          gcloud container node-pools delete gpu-spot-pool --cluster aiops-gke --zone us-central1-a --quiet || true
          echo "✅ gpu-spot-pool removido do cluster GKE com sucesso."

      - name: Injetar Falha de Liveness Probe (service-api)
        if: github.event.inputs.action == 'inject_probe_crash'
        run: |
          echo "💥 Injetando falha de liveness probe em service-api (/healthz-invalid)..."
          kubectl patch deployment service-api -n apps --type='json' -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/httpGet/path", "value": "/healthz-invalid"},{"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/periodSeconds", "value": 5}]'
          echo "⏳ Aguardando 25s para o Kubelet detectar a falha de probe e iniciar CrashLoop..."
          sleep 25
          kubectl get pods -l app=service-api -n apps -o wide

      - name: Injetar Falha OOMKilled (service-api)
        if: github.event.inputs.action == 'inject_oom_kill'
        run: |
          echo "💥 Injetando limite insuficiente de memória em service-api (16Mi)..."
          kubectl set resources deployment/service-api -n apps --limits=memory=16Mi,cpu=200m --requests=memory=16Mi,cpu=100m
          echo "⏳ Aguardando 25s para o Kubelet/Kernel finalizar o container com OOMKilled (Exit Code 137)..."
          sleep 25
          kubectl get pods -l app=service-api -n apps -o wide

      - name: Restaurar Liveness Probe e Recursos (service-api)
        if: github.event.inputs.action == 'restore_service_api'
        run: |
          echo "🧹 Restaurando service-api para configuração saudável original (128Mi/256Mi e /healthz)..."
          kubectl patch deployment service-api -n apps --type='json' -p='[{"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/httpGet/path", "value": "/healthz"},{"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/periodSeconds", "value": 10}]' || true
          kubectl set resources deployment/service-api -n apps --limits=memory=256Mi,cpu=250m --requests=memory=128Mi,cpu=150m
          kubectl rollout status deployment/service-api -n apps --timeout=60s
          echo "✅ service-api restaurado e saudável!"

      - uses: hashicorp/setup-terraform@v3
        if: github.event.inputs.action == 'verify_destroyed'
        with:
          terraform_version: "1.9.8"

      - name: Double Check Destruição Total no GCP (FinOps)
        if: github.event.inputs.action == 'verify_destroyed'
        run: |
          echo "========================================================="
          echo "   DOUBLE CHECK: AUDITORIA DE RECURSOS NO GOOGLE CLOUD   "
          echo "========================================================="

          echo ""
          echo "--- 1. ESTADO REMOTO DO TERRAFORM (GCS BACKEND) ---"
          cd infra/environments/test
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="prefix=environments/test" -input=false
          STATE_LIST=$(terraform state list 2>/dev/null || true)
          if [ -z "$STATE_LIST" ]; then
            echo "✅ CONFIRMADO: State remoto está 100% VAZIO (0 recursos gerenciados)."
          else
            echo "⚠️ Recursos ainda listados no state:"
            echo "$STATE_LIST"
          fi
          cd ../../..

          echo ""
          echo "--- 2. CLUSTERS GKE (KUBERNETES) ---"
          CLUSTERS=$(gcloud container clusters list --project=${{ secrets.GCP_PROJECT_ID }} --format="table(name,location,status)" 2>&1 || true)
          echo "$CLUSTERS"

          echo ""
          echo "--- 3. INSTÂNCIAS COMPUTE ENGINE (VMS / GPUS) ---"
          INSTANCES=$(gcloud compute instances list --project=${{ secrets.GCP_PROJECT_ID }} --format="table(name,zone,status)" 2>&1 || true)
          echo "$INSTANCES"

          echo ""
          echo "--- 4. DISCOS PERSISTENTES ---"
          DISKS=$(gcloud compute disks list --project=${{ secrets.GCP_PROJECT_ID }} --format="table(name,zone,sizeGb,status)" 2>&1 || true)
          echo "$DISKS"

          echo ""
          echo "--- 5. REDES VPC AIOPS ---"
          VPC=$(gcloud compute networks list --project=${{ secrets.GCP_PROJECT_ID }} --filter="name:aiops-vpc" --format="table(name,subnetMode)" 2>&1 || true)
          echo "$VPC"

          echo ""
          echo "--- 6. TÓPICOS E SUBSCRIPTIONS PUB/SUB ---"
          TOPICS=$(gcloud pubsub topics list --project=${{ secrets.GCP_PROJECT_ID }} --format="table(name)" 2>&1 || true)
          echo "$TOPICS"

          echo ""
          echo "--- 7. VERIFICAÇÃO DE CUSTO / SALDO ---"
          gcloud billing budgets list --billing-account=${{ secrets.GCP_BILLING_ACCOUNT_ID }} --format="yaml" 2>/dev/null || true

          echo ""
          echo "========================================================="
          echo "               FIM DA AUDITORIA FINOPS                   "
          echo "========================================================="
