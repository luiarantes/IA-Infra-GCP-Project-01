name: Deploy Microservices

# Fase 8.1: build+push+deploy dos 4 servicos do fluxo de microsservicos
# (gateway, service-api, service-worker, service-downstream), incluindo
# os HPA de cada um (fase 8.3). Workflow separado do deploy-app.yml (que
# continua cuidando so do podinfo) - nao compartilha triggers nem toca
# nos manifests do podinfo.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: aiops-gke
  CLUSTER_LOCATION: us-central1-a
  AR_REGION: us-central1
  AR_REPOSITORY: sample-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Docker para push no Artifact Registry
        run: gcloud auth configure-docker "${{ env.AR_REGION }}-docker.pkg.dev" --quiet

      - name: Build e push das imagens
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          AR_URL="${{ env.AR_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.AR_REPOSITORY }}"
          for SERVICE in gateway service-api service-worker service-downstream; do
            docker build -t "${AR_URL}/${SERVICE}:${{ github.sha }}" "apps/${SERVICE}"
            docker push "${AR_URL}/${SERVICE}:${{ github.sha }}"
          done

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Garantir namespace apps
        run: kubectl create namespace apps --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy da ServiceAccount compartilhada (Workload Identity)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: envsubst '${PROJECT_ID}' < apps/shared/serviceaccount.yaml | kubectl apply -f -

      - name: Deploy dos servicos
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          AR_URL="${{ env.AR_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.AR_REPOSITORY }}"
          for SERVICE in gateway service-api service-worker service-downstream; do
            export IMAGE="${AR_URL}/${SERVICE}:${{ github.sha }}"
            envsubst '${IMAGE} ${PROJECT_ID}' < "apps/${SERVICE}/deployment.yaml" | kubectl apply -f -
            kubectl apply -f "apps/${SERVICE}/service.yaml"
            kubectl apply -f "apps/${SERVICE}/hpa.yaml"
          done

      - name: Aguardar rollout
        run: |
          set -euo pipefail
          for SERVICE in gateway service-api service-worker service-downstream; do
            kubectl rollout status "deployment/${SERVICE}" -n apps --timeout=180s
          done

      - name: Smoke Test E2E pós-deploy (k6)
        run: |
          echo "🚀 Executando validação de fumaça (Smoke Test) pós-deploy..."
          kubectl delete job k6-smoke-test -n apps --ignore-not-found
          kubectl create configmap k6-smoke-script -n apps \
            --from-file=smoke-test.js=load-test/smoke-test.js \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f load-test/smoke-job.yaml
          kubectl wait --for=condition=complete job/k6-smoke-test -n apps --timeout=180s || {
            echo "❌ Smoke Test falhou ou excedeu timeout! Status do Pod e eventos:"
            kubectl get pods -l job-name=k6-smoke-test -n apps -o wide || true
            kubectl describe job k6-smoke-test -n apps || true
            kubectl describe pods -l job-name=k6-smoke-test -n apps || true
            echo "Logs do container k6:"
            kubectl logs job/k6-smoke-test -n apps || true
            exit 1
          }
          echo "✅ Smoke Test concluído com sucesso! Pods saudáveis e respondendo a tráfego real."
          kubectl logs job/k6-smoke-test -n apps
