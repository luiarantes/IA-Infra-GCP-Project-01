name: Deploy Observability

on:
  workflow_dispatch:
    inputs:
      stack_mode:
        description: "Modo de deploy da stack ('simple' ou 'distributed')"
        required: false
        default: "simple"
        type: choice
        options:
          - simple
          - distributed

permissions:
  contents: read
  id-token: write

env:
  CLUSTER_NAME: aiops-gke
  CLUSTER_LOCATION: us-central1-a

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy da Stack de Observabilidade (OpenObserve + Grafana Labs LGTM + OTel Collector)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STACK_MODE: ${{ github.event.inputs.stack_mode || 'simple' }}
        run: |
          set -euo pipefail
          echo "🚀 Realizando deploy da observabilidade no modo: ${STACK_MODE}..."
          kubectl apply -f observability/openobserve.yaml

          if [ "${STACK_MODE}" = "distributed" ]; then
            echo "🧹 Removendo instâncias e configurações anteriores do modo simples para migração limpa de storage..."
            kubectl delete deployment loki tempo --ignore-not-found
            kubectl delete configmap loki-config tempo-config --ignore-not-found
            echo "📦 Aplicando Loki e Tempo configurados com Google Cloud Storage (GCS)..."
            envsubst '${PROJECT_ID}' < observability/distributed/loki-distributed.yaml | kubectl apply -f -
            envsubst '${PROJECT_ID}' < observability/distributed/tempo-distributed.yaml | kubectl apply -f -
          else
            echo "📦 Aplicando Loki e Tempo no modo simples (monolítico)..."
            kubectl apply -f observability/loki.yaml
            kubectl apply -f observability/tempo.yaml
          fi

          kubectl apply -f observability/pyroscope.yaml
          kubectl apply -f observability/beyla.yaml
          kubectl apply -f observability/grafana-dashboards.yaml
          kubectl apply -f observability/grafana.yaml
          kubectl apply -f observability/otel-collector.yaml

      - name: Aguardar Rollout dos Serviços de Observabilidade
        run: |
          set -euo pipefail
          kubectl rollout status deployment/openobserve --timeout=180s
          kubectl rollout status deployment/tempo --timeout=180s
          kubectl rollout status deployment/loki --timeout=180s
          kubectl rollout status deployment/pyroscope --timeout=180s
          kubectl rollout status deployment/grafana --timeout=180s
          kubectl rollout status daemonset/beyla --timeout=180s
          kubectl rollout status deployment/otel-collector --timeout=180s

      - name: Diagnóstico de Falha no Rollout
        if: failure()
        run: |
          echo "=== PODS STATUS ==="
          kubectl get pods -o wide
          echo "=== TEMPO POD LOGS ==="
          kubectl logs deployment/tempo --tail=100 || true
          echo "=== TEMPO POD DESCRIBE ==="
          kubectl describe pod -l app=tempo || true
          echo "=== LOKI POD LOGS ==="
          kubectl logs deployment/loki --tail=100 || true
          echo "=== LOKI POD DESCRIBE ==="
          kubectl describe pod -l app=loki || true


      - name: Exibir IPs de Acesso Público (OpenObserve e Grafana)
        run: |
          echo "⏳ Aguardando atribuição de IPs públicos nos LoadBalancers..."
          OO_IP=""
          GRAFANA_IP=""
          for i in {1..30}; do
            if [ -z "$OO_IP" ]; then
              OO_IP=$(kubectl get svc openobserve -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -z "$GRAFANA_IP" ]; then
              GRAFANA_IP=$(kubectl get svc grafana -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$OO_IP" ] && [ -n "$GRAFANA_IP" ]; then
              break
            fi
            sleep 5
          done

          echo "========================================================="
          echo "🎉 OpenObserve Web UI: http://${OO_IP:-<pendente>}:5080"
          echo "   Credenciais: admin@example.com / ComplexPassword123#"
          echo "📈 Grafana OSS Web UI: http://${GRAFANA_IP:-<pendente>}:3000"
          echo "   Credenciais: admin / admin"
          echo "========================================================="
